[project]
name = "seahorse"
version = "0.0.0"
description = "Open standard for persistent, self-evolving LLM agent memory (open-core)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "ssanvi-builds" }]
keywords = ["llm", "agent-memory", "bi-temporal", "knowledge-base", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dependencies land incrementally per component during Fase 6 (persistence, engine,
# llm, write-path, retrieval, graph). #14 CLI Bootstrap is the first component to
# introduce a runtime dep: Typer is the terminal surface (L6, ADR-06) — the human
# and the scripter invoke `seahorse ...`. The stdlib-only contract is preserved
# for the core (engine/facade/mcp/persistence): Typer lives ONLY in the CLI layer.
dependencies = [
    "typer>=0.12",
]

[project.scripts]
seahorse = "seahorse.cli.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seahorse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=seahorse --cov-fail-under=80 --cov-report=term-missing"
markers = [
    "mvp1_axis: TIMELINE MVP-1 accessors signed now but revisable until MVP-1 (SO-1 safeguard 2)",
]