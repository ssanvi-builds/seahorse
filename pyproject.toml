[project]
name = "seahorse-memory"
version = "0.22.0"
description = "Persistent, bi-temporal memory for LLM agents — local-first, MCP-native, Obsidian-readable."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "ssanvi-builds" }]
keywords = ["llm", "agent-memory", "bi-temporal", "knowledge-base", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies:
# - Typer is the CLI surface (humans and scripts) and lives only in seahorse.cli.
# - Pydantic v2 is the canonical `Episode` contract, used across the core
#   (contracts → engine/persistence/facade/mcp transitively).
# - ruamel.yaml + python-frontmatter are confined to the frontmatter adapter and
#   do NOT propagate to the core.
# - sqlite-vec + numpy power the vector index and embedding blob shape.
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "ruamel.yaml>=0.18",
    "python-frontmatter>=1",
    "sqlite-vec==0.1.9",
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://github.com/ssanvi-builds/seahorse"
Repository = "https://github.com/ssanvi-builds/seahorse"
Documentation = "https://github.com/ssanvi-builds/seahorse#readme"
Changelog = "https://github.com/ssanvi-builds/seahorse/blob/main/CHANGELOG.md"
Issues = "https://github.com/ssanvi-builds/seahorse/issues"

[project.scripts]
seahorse = "seahorse.cli.app:main"
seahorse-mcp = "seahorse.mcp.profile:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-rerunfailures>=14",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]
# The heavy inference stack for semantic retrieval (FastEmbed ONNX, mE5-small
# fp32-O4 bundle). NOT in the default `uv sync --extra dev`: without this extra,
# recall falls back to the honest current-state listing and no model download
# happens. Install with `uv sync --extra dev --extra embeddings`.
embeddings = [
    "fastembed>=0.6.0",
    # <1.29: 1.29.0 segfaults during its pybind init when the process argv is
    # large (>= ~32KB body + default 8MB stack) after the CLI's other C
    # extensions load. `uv tool install` does not use uv.lock, so tool envs
    # float to the newest release — cap until upstream fixes it.
    "onnxruntime>=1.20,<1.29",
]
# The multi-LLM backend (LiteLLM unifies the 100+ provider surface). Also
# optional: without this extra, `seahorse.llm` still imports (the contract +
# StubLLMClient are stdlib-light) but the real path degrades llm→skip with a
# setup hint. Install with `uv sync --extra dev --extra llm`.
llm = [
    "litellm>=1.0",
]
# The benchmark harness's own dependencies live HERE, never in the core.
# `datasets` (HuggingFace loader) and `tiktoken` (real token counting) are
# imported lazily inside the benchmark package, so `import seahorse.benchmark`
# stays importable without this extra. Install with
# `uv sync --extra dev --extra benchmark`.
benchmark = [
    "datasets>=3.0",
    "tiktoken>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seahorse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=seahorse --cov-fail-under=80 --cov-report=term-missing"
markers = [
    "mvp1_axis: points-in-time accessors that are signed but still revisable before the feature seals",
    "property: hypothesis property-based / stateful invariant tests (bi-temporal safety net)",
    "llm_gate: CI gate integration tests against a real Ollama (weakest model qwen3:0.6b); gated by SEAHORSE_RUN_LLM_TESTS=1, run via `pytest -m llm_gate` in ci-llm-gate.yml",
]
