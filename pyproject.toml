[project]
name = "seahorse"
version = "0.1.0"
description = "Open standard for persistent, self-evolving LLM agent memory (open-core)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "ssanvi-builds" }]
keywords = ["llm", "agent-memory", "bi-temporal", "knowledge-base", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dependencies land incrementally per component during Fase 6 (persistence, engine,
# llm, write-path, retrieval, graph). #14 CLI Bootstrap introduced the first
# runtime dep: Typer is the terminal surface (L6, ADR-06) — the human and the
# scripter invoke `seahorse ...`.
#
# #3 (frontmatter adapter/migrator) ships the canonical F3.1 `Episode` as a
# Pydantic v2 model and migrates #6 to import it (B1 — single `Episode` type
# system-wide). Pydantic therefore lands in the CORE (contracts → engine/
# persistence/facade/mcp transitively). This relaxes the stdlib-only-core
# contract; accepted deviation (F4 recommends Pydantic v2 canonical; B1 forces
# it). Only `ruamel.yaml` + `python-frontmatter` stay confined to
# `seahorse/frontmatter/` (they do NOT propagate to the core). Typer still lives
# ONLY in the CLI layer.
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "ruamel.yaml>=0.18",
    "python-frontmatter>=1",
    "sqlite-vec==0.1.9",
    "numpy>=2.0",
]

[project.scripts]
seahorse = "seahorse.cli.app:main"
seahorse-mcp = "seahorse.mcp.profile:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]
# M1-B.2: the heavy inference stack for #7 (FastEmbed ONNX, mE5-small fp32-O4
# bundle — OQ-7-12). NOT in the default `uv sync --extra dev`: without this
# extra, build_facade falls back to the honest G2 recall regime and no model
# download happens. Install with `uv sync --extra dev --extra embeddings`.
embeddings = [
    "fastembed>=0.6.0",
    "onnxruntime>=1.20",
]
# M4-C.2: the #4 Multi-LLM backend (ADR-05 — LiteLLM unifies the 100+ provider
# surface). Also optional: without this extra, `seahorse.llm` still imports
# (the contract + StubLLMClient are stdlib-light) but the real path degrades
# llm→skip with a setup hint. Install with `uv sync --extra dev --extra llm`.
llm = [
    "litellm>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seahorse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=seahorse --cov-fail-under=80 --cov-report=term-missing"
markers = [
    "mvp1_axis: TIMELINE MVP-1 accessors signed now but revisable until MVP-1 (SO-1 safeguard 2)",
    "property: hypothesis property-based / stateful invariant tests (bi-temporal safety net)",
    "llm_gate: CI gate integration tests against a real Ollama (weakest model qwen3:0.6b); gated by SEAHORSE_RUN_LLM_TESTS=1, run via `pytest -m llm_gate` in ci-llm-gate.yml (f5-04 §2.2)",
]
