name: Publish to PyPI

# Release-on-tag: pushing a `v*` tag builds the wheel and publishes it to
# PyPI as `seahorse-memory`. The import package stays `seahorse`; only the
# distribution name changes.
#
# Chain (nothing publishes to PyPI without passing the gate before it):
#   test → build-and-publish → verify-pypi
#   * build-and-publish — after the test gate: build + publish the tag to PyPI.
#   * verify-pypi       — post-publish verification of the real PyPI artifact
#                         (e2e-pypi.sh, fast): install the wheel users get,
#                         run the README onboarding + MCP, assert no corruption.
#
# TestPyPI pre-release (publish-testpypi → verify-testpypi before PyPI) is
# deferred until a TESTPYPI_API_TOKEN exists; the post-publish verify-pypi job
# is the current safety net.
#
# Secrets: PYPI_API_TOKEN (PyPI, environment `pypi`), a PyPI API token scoped
# to the `seahorse-memory` project.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: test gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (with dev extras)
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest
        env:
          SEAHORSE_RUN_INSTALL_SMOKE: "0"

  build-and-publish:
    name: build + publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}

  verify-pypi:
    name: verify PyPI artifact (e2e-pypi.sh)
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install-and-run the PyPI artifact
        run: scripts/e2e-pypi.sh
        env:
          SEAHORSE_FAST: "1"
